version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keeper-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MOCK_BANK_DATABASE_PATH=/data/bank_ledger.db
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
    volumes:
      - mock_bank_ledger_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  mock_bank_ledger_data:
    name: keeper_mock_bank_ledger_data
